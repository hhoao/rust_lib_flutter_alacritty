name: Precompile Binaries

# Builds and uploads signed Rust artifacts for Cargokit consumers without a
# local Rust toolchain. Also uploads macOS cdylibs for Dart/widget tests.
on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "cargokit/**"
      - ".github/workflows/precompile-binaries.yml"
  workflow_dispatch:

concurrency:
  group: precompile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  precompile:
    name: Precompile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            install_linux_deps: true
            upload_macos_cdylib: false
          - os: macos-latest
            install_linux_deps: false
            upload_macos_cdylib: true
          - os: windows-latest
            install_linux_deps: false
            upload_macos_cdylib: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.install_linux_deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve Cargokit build_tool
        working-directory: cargokit/build_tool
        run: dart pub get

      - name: Verify signing key matches cargokit.yaml
        working-directory: cargokit/build_tool
        env:
          PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}
        run: dart run tool/verify_key_pair.dart ../../rust

      - name: Precompile and upload platform binaries
        working-directory: cargokit/build_tool
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}
        run: >
          dart run build_tool precompile-binaries -v
          --manifest-dir=../../rust
          --repository=${{ github.repository }}

      - name: Upload macOS cdylib artifacts for Dart tests
        if: matrix.upload_macos_cdylib
        working-directory: cargokit/build_tool
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}
        run: >
          dart run tool/upload_macos_cdylib.dart -v
          --manifest-dir=../../rust
          --repository=${{ github.repository }}

  verify:
    name: Verify published binaries
    needs: precompile
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve Cargokit build_tool
        working-directory: cargokit/build_tool
        run: dart pub get

      - name: Verify signatures and coverage
        working-directory: cargokit/build_tool
        run: |
          dart run build_tool verify-binaries --manifest-dir=../../rust | tee /tmp/verify.log
          if grep -E 'INVALID SIGNATURE' /tmp/verify.log | grep -qE 'windows-msvc|linux-gnu|apple-darwin'; then
            echo 'Desktop precompiled binaries failed signature verification'
            exit 1
          fi
