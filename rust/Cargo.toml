[package]
name = "rust_lib_flutter_alacritty"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
# Fork pin: RegexSearch::with_case_insensitive (until upstream merges).
# Bump `rev` to move the engine forward. To hack locally, add a [patch] path.
alacritty_terminal = { git = "https://github.com/hhoao/alacritty.git", rev = "e6cf18ffcd099aa6118da35ea2476a50d54bd3b2" }
regex-syntax = "0.8"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
